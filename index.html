<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma'muriy Hududiy Birliklarni O'zgartirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Maxsus effektlar */
        .card-transition {
            transition: all 0.5s ease-in-out;
        }
        .answer-box {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-red {
            0%, 100% { color: #ef4444; }
            50% { color: #f87171; }
        }
        .timer-danger {
            animation: pulse-red 1s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col p-4 overflow-hidden">

    <!-- HEADER QISMI -->
    <header class="bg-slate-900 p-4 rounded-2xl border border-slate-700 shadow-2xl mb-6 flex justify-between items-center">
        
        <!-- Sarlavha -->
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-3 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-wider text-white uppercase">Ma'muriy hududiy birliklarni o'zgartirish</h1>
                <p class="text-slate-400 text-sm">Kazusli topshiriqlar paneli</p>
            </div>
        </div>

        <!-- Timer va Boshqaruv -->
        <div class="flex items-center gap-6 bg-slate-800 p-3 rounded-xl border border-slate-700">
            
            <!-- Vaqtni o'zgartirish tugmalari -->
            <div class="flex flex-col gap-1">
                <button onclick="adjustTime(60)" class="bg-slate-700 hover:bg-slate-600 text-green-400 text-xs px-2 py-1 rounded font-bold transition">+ 1 daq</button>
                <button onclick="adjustTime(-60)" class="bg-slate-700 hover:bg-slate-600 text-red-400 text-xs px-2 py-1 rounded font-bold transition">- 1 daq</button>
            </div>

            <!-- Asosiy Timer -->
            <div id="timerDisplay" class="text-6xl font-black font-mono tracking-tighter text-blue-400 min-w-[180px] text-center">
                03:00
            </div>

            <!-- Boshqaruv tugmalari -->
            <div class="flex gap-2">
                <button id="btnStart" onclick="toggleTimer()" class="p-4 rounded-full bg-green-600 hover:bg-green-500 text-white shadow-lg active:scale-95 transition">
                    <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="iconPause" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <button onclick="finishEarly()" class="p-4 rounded-full bg-red-600 hover:bg-red-500 text-white shadow-lg active:scale-95 transition" title="Muddatidan oldin tugatish">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                    </svg>
                </button>

                <button onclick="resetApp()" class="p-4 rounded-full bg-slate-600 hover:bg-slate-500 text-white shadow-lg active:scale-95 transition" title="Qayta yuklash">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ASOSIY GRID -->
    <main id="cardsContainer" class="flex-1 grid grid-cols-2 gap-6 pb-4">
        <!-- Kartalar JavaScript orqali yaratiladi -->
    </main>

    <!-- JAVASCRIPT -->
    <script>
        // --- MA'LUMOTLAR ---
        const scenarios = [
            {
                id: 1,
                name: "1-JAMOA",
                color: "bg-indigo-600",
                question: "Samarqand viloyati Paxtachi tumanidagi 'Qarnab' qishlog'ini Navoiy viloyati Xatirchi tumani tarkibiga o'tkazish tashabbusi bilan kim chiqadi va yakuniy qarorni kim qabul qiladi?",
                answer: "Tashabbus xalq deputatlari viloyat Kengashlari tomonidan ko'tariladi. Yakuniy qarorni O'zbekiston Respublikasi Oliy Majlisi Senati qabul qiladi.",
                law: "Konstitutsiya 81-modda; 'Ma'muriy-hududiy tuzilish to'g'risida'gi qonun."
            },
            {
                id: 2,
                name: "2-JAMOA",
                color: "bg-blue-600",
                question: "Toshkent shahri tarkibida yangi 'Yangi O'zbekiston' tumanini tuzish uchun aholining roziligi shartmi? Agar shart bo'lsa, u qanday shaklda olinadi?",
                answer: "Ha, shart. Tegishli hududda yashovchi fuqarolarning fikri hisobga olinadi, lekin bu referendum orqali emas, balki Kengashlar muhokamasi orqali amalga oshiriladi.",
                law: "'Ma'muriy-hududiy tuzilish to'g'risida'gi qonun, 6-modda."
            },
            {
                id: 3,
                name: "3-JAMOA",
                color: "bg-orange-600",
                question: "Farg'ona viloyati hokimi o'z qarori bilan Quvasoy shahrini Farg'ona tumani tarkibiga qo'shib yubordi. Ushbu qaror qonuniymi? Tumanlarni tugatish tartibi qanday?",
                answer: "Noqonuniy. Viloyat hokimi tuman/shaharlarni tugatish vakolatiga ega emas. Buni faqat Oliy Majlis Senati Vazirlar Mahkamasi taklifiga binoan amalga oshiradi.",
                law: "Konstitutsiya, Mahalliy davlat hokimiyati to'g'risidagi qonun."
            },
            {
                id: 5,
                name: "5-JAMOA",
                color: "bg-purple-600",
                question: "Xorazm viloyatidagi 'Urganch' tumani nomini 'Jaloliddin Manguberdi' tumani deb o'zgartirish haqida qaror qabul qilish uchun qaysi organlar ruxsati kerak?",
                answer: "Toponimik obyektlarga nom berish komissiyasi xulosasi, Viloyat Kengashi qarori va Oliy Majlis Senatining qarori talab etiladi.",
                law: "'Geografik obyektlarning nomlari to'g'risida'gi qonun."
            }
        ];

        // --- HOLAT (STATE) ---
        let timeLeft = 180;
        let isActive = false;
        let isFinished = false;
        let timerInterval = null;

        // --- DASTURNI BOSHLASH ---
        function init() {
            renderCards();
            updateTimerDisplay();
        }

        // --- TIMER LOGIKASI ---
        function toggleTimer() {
            if (isActive) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (timeLeft <= 0) return;
            isActive = true;
            document.getElementById('iconPlay').classList.add('hidden');
            document.getElementById('iconPause').classList.remove('hidden');
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    finishTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isActive = false;
            clearInterval(timerInterval);
            document.getElementById('iconPlay').classList.remove('hidden');
            document.getElementById('iconPause').classList.add('hidden');
        }

        function finishTimer() {
            pauseTimer();
            timeLeft = 0;
            isFinished = true;
            updateTimerDisplay();
            updateCardsToFinishedState();
        }

        function finishEarly() {
            if (isFinished) return;
            finishTimer();
        }

        function adjustTime(seconds) {
            if (isActive) return; // Vaqt ketayotganda o'zgartirib bo'lmaydi
            timeLeft += seconds;
            if (timeLeft < 0) timeLeft = 0;
            isFinished = false;
            updateTimerDisplay();
            // Kartalarni qayta boshlang'ich holatga keltirish agar vaqt qo'shilsa
            if (timeLeft > 0) {
                renderCards(); // Reset UI visually to "Tahlil qilinmoqda"
            }
        }

        function resetApp() {
            pauseTimer();
            timeLeft = 180;
            isFinished = false;
            updateTimerDisplay();
            renderCards();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const display = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            const timerEl = document.getElementById('timerDisplay');
            
            timerEl.textContent = display;

            if (timeLeft === 0) {
                timerEl.classList.remove('text-blue-400');
                timerEl.classList.add('text-red-600', 'timer-danger');
                timerEl.textContent = "00:00";
            } else if (timeLeft < 30) {
                timerEl.classList.remove('text-blue-400');
                timerEl.classList.add('text-red-500', 'timer-danger');
            } else {
                timerEl.classList.remove('text-red-500', 'text-red-600', 'timer-danger');
                timerEl.classList.add('text-blue-400');
            }
        }

        // --- KARTALARNI CHIZISH ---
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            scenarios.forEach(item => {
                const card = document.createElement('div');
                card.className = "flex flex-col h-full bg-slate-800 border-2 border-slate-600 rounded-xl overflow-hidden card-transition";
                card.id = `card-${item.id}`;

                card.innerHTML = `
                    <div class="p-4 text-center font-black text-2xl uppercase tracking-widest text-white ${item.color}">
                        ${item.name}
                    </div>
                    <div class="flex-1 p-6 flex flex-col justify-center relative">
                        <!-- SAVOL -->
                        <div id="question-${item.id}" class="space-y-4">
                            <h3 class="text-xl text-yellow-400 font-bold border-b border-slate-600 pb-2 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                                KAZUS №${item.id}
                            </h3>
                            <p class="text-xl leading-relaxed text-white font-medium">
                                ${item.question}
                            </p>
                        </div>

                        <!-- JAVOB (Boshida yashirin) -->
                        <div id="answer-${item.id}" class="hidden space-y-4 answer-box">
                            <h3 class="text-xl text-green-400 font-bold border-b border-green-900 pb-2 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                TO'G'RI JAVOB:
                            </h3>
                            <p class="text-lg leading-relaxed text-slate-200">
                                ${item.answer}
                            </p>
                            <div class="mt-2 text-sm text-slate-400 font-mono bg-slate-900 p-2 rounded border border-slate-700">
                                <strong>ASOS:</strong> ${item.law}
                            </div>
                        </div>
                    </div>

                    <!-- PASTKI QISM (Footer) -->
                    <div id="footer-${item.id}" class="bg-slate-900 p-3 flex justify-between items-center border-t border-slate-700 min-h-[70px]">
                        <span class="text-slate-400 text-sm font-bold">HOLAT:</span>
                        <span class="text-yellow-500 font-bold animate-pulse flex items-center gap-2">
                            <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            TAHLIL QILINMOQDA...
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- VAQT TUGAGANDAGI O'ZGARISH ---
        function updateCardsToFinishedState() {
            scenarios.forEach(item => {
                const footer = document.getElementById(`footer-${item.id}`);
                footer.innerHTML = `
                    <span class="text-red-500 text-sm font-bold animate-pulse">VAQT TUGADI</span>
                    <button onclick="revealAnswer(${item.id})" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-full shadow-lg transform transition active:scale-95 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        JAVOBNI KO'RISH
                    </button>
                `;
            });
        }

        // --- JAVOBNI OCHISH ---
        function revealAnswer(id) {
            const questionEl = document.getElementById(`question-${id}`);
            const answerEl = document.getElementById(`answer-${id}`);
            const cardEl = document.getElementById(`card-${id}`);
            const footerEl = document.getElementById(`footer-${id}`);

            // Animatsiya bilan almashtirish
            questionEl.classList.add('hidden');
            answerEl.classList.remove('hidden');
            
            // Karta uslubini o'zgartirish (yashil chegara)
            cardEl.classList.remove('border-slate-600');
            cardEl.classList.add('border-green-500');

            // Tugmani o'zgartirish (ixtiyoriy, agar kerak bo'lsa)
            footerEl.querySelector('button').classList.add('bg-slate-700', 'text-slate-300');
            footerEl.querySelector('button').innerHTML = `
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                 OCHILDI
            `;
        }

        // Ilovani ishga tushirish
        init();

    </script>
</body>
</html>
