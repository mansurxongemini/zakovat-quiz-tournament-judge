<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma'muriy-Hududiy Tuzilish Masalalari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-enter { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        .answer-reveal { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.95); } 
            100% { opacity: 1; transform: scale(1); } 
        }
        @keyframes pulse-critical {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
        }

        .timer-critical { 
            color: #ef4444; 
            animation: pulse-critical 1.5s infinite;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Login Screen Overlay */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: #0B1120;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-[#0B1120] text-slate-100 min-h-screen flex flex-col relative overflow-y-auto overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <!-- LOGIN SCREEN -->
    <div id="loginOverlay">
        <div class="glass p-8 md:p-12 rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full mx-4 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <h2 class="text-2xl font-black mb-2 text-white tracking-widest uppercase">Tizimga Kirish</h2>
            <p class="text-slate-400 mb-8 text-sm"></p>
            
            <input type="password" id="passwordInput" placeholder="Parolni kiriting..." 
                   class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-4 rounded-xl mb-4 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-center text-lg tracking-widest"
                   onkeypress="if(event.key === 'Enter') checkPassword()">
            
            <button onclick="checkPassword()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95 uppercase tracking-widest">
                Kirish
            </button>
            <p id="loginError" class="text-red-500 mt-4 text-sm font-medium hidden">Parol noto'g'ri!</p>
        </div>
    </div>

    <!-- MAIN APP (Hidden initially) -->
    <div id="mainApp" class="hidden flex-col min-h-screen">
        <canvas id="confetti-canvas"></canvas>

        <!-- HEADER -->
        <header class="sticky top-0 z-40 glass border-b border-slate-800 shadow-2xl transition-all duration-300">
            <div class="max-w-7xl mx-auto px-4 py-3 md:px-6 flex flex-col md:flex-row justify-between items-center gap-4">
                
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <div class="relative bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg md:text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400 uppercase">MA'MURIY-HUDUDIY TUZILISH MASALALARI</h1>
                    </div>
                </div>

                <!-- Timer & Controls -->
                <div class="flex items-center gap-3 w-full md:w-auto justify-between bg-slate-800/50 p-1.5 rounded-2xl border border-slate-700/50 backdrop-blur-md">
                    
                    <div class="flex flex-col gap-0.5 px-1">
                        <button onclick="soundManager.click(); adjustTime(60)" class="text-[10px] font-bold text-green-400 hover:bg-slate-700/50 px-2 py-0.5 rounded transition">+1 MIN</button>
                        <button onclick="soundManager.click(); adjustTime(-60)" class="text-[10px] font-bold text-red-400 hover:bg-slate-700/50 px-2 py-0.5 rounded transition">-1 MIN</button>
                    </div>

                    <div id="timerDisplay" class="text-4xl md:text-5xl font-black font-mono tracking-tighter text-white px-4 min-w-[140px] text-center" style="font-variant-numeric: tabular-nums;">
                        03:00
                    </div>

                    <div class="flex gap-1 pr-1">
                        <button id="btnStart" onclick="toggleTimer()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-blue-600 hover:bg-blue-500 text-white shadow-lg active:scale-95 transition-all">
                            <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="iconPause" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>
                        
                        <button onclick="soundManager.error(); finishEarly()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-700 hover:bg-red-600 hover:text-white text-slate-300 transition-all active:scale-95" title="Tugatish">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                            </svg>
                        </button>

                        <button onclick="soundManager.click(); resetApp()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all active:scale-95" title="Qayta yuklash">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>

                        <button onclick="toggleFullScreen()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all active:scale-95" title="To'liq ekran">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN GRID -->
        <main id="cardsContainer" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 p-4 md:p-6 max-w-[1400px] mx-auto w-full pb-20">
            <!-- Cards rendered by JS -->
        </main>
    </div>

    <script>
        // --- 0. LOGIN SYSTEM ---
        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('loginError');
            
            if (input === '.Rustamov.007') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('flex');
                init(); // Start app only after login
            } else {
                errorEl.classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // --- 1. PROFESSIONAL OVOZ TIZIMI (AudioContext) ---
        const soundManager = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function(freq, type, duration, vol = 0.1) {
                if (!this.ctx) this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            click: function() { this.playTone(800, 'sine', 0.1, 0.05); },
            tick: function() { this.playTone(1000, 'square', 0.05, 0.03); },
            warning: function() { this.playTone(600, 'sawtooth', 0.1, 0.05); },
            alarm: function() {
                if (!this.ctx) this.init();
                const now = this.ctx.currentTime;
                [440, 330, 440, 330].forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0.2, now + i * 0.2);
                    gain.gain.linearRampToValueAtTime(0, now + i * 0.2 + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.2);
                    osc.stop(now + i * 0.2 + 0.2);
                });
            },
            success: function() {
                if (!this.ctx) this.init();
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0.1, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.5);
                });
            },
            error: function() { this.playTone(150, 'sawtooth', 0.3, 0.2); }
        };

        // --- 2. KONFETTI TIZIMI ---
        const confetti = {
            canvas: document.getElementById('confetti-canvas'),
            ctx: document.getElementById('confetti-canvas').getContext('2d'),
            particles: [],
            isActive: false,
            init: function() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize: function() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },
            spawn: function(x, y) {
                for(let i=0; i<50; i++) {
                    this.particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 1) * 15,
                        color: `hsl(${Math.random()*360}, 100%, 50%)`,
                        size: Math.random() * 8 + 4,
                        life: 100
                    });
                }
                if (!this.isActive) {
                    this.isActive = true;
                    this.loop();
                }
            },
            loop: function() {
                if (this.particles.length === 0) {
                    this.isActive = false;
                    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
                    return;
                }
                this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
                for(let i=this.particles.length-1; i>=0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5;
                    p.life--;
                    p.size *= 0.95;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    this.ctx.fill();
                    if(p.life <= 0) this.particles.splice(i, 1);
                }
                requestAnimationFrame(() => this.loop());
            }
        };
        confetti.init();

        // --- 3. MA'LUMOTLAR BAZASI (MAXSUS 4 TA KAZUS) ---
        const questionPool = [
            {
                question: "Viloyat hokimi aholisi 25 000 kishi bo'lgan yirik va istiqbolli qishloqni to'g'ridan-to'g'ri 'viloyat bo'ysunuvidagi shahar' toifasiga o'tkazish bo'yicha qaror qabul qilib, iltimosnomani O'zbekiston Respublikasi Vazirlar Mahkamasiga yubordi. Viloyat hokimligi tomonidan tuzilgan maxsus komissiya o'zining ichki bayonnomasi bilan xulosa berish muddatini 40 kunga uzaytirdi. Vazirlar Mahkamasi iltimosnomani ko'rib chiqib, o'z apparati xodimlari orqali yangi shaharning kartografik chizmalarini tayyorlatdi va hujjatlarni Oliy Majlisga yubordi.",
                errorsList: [
                    { pts: "15", text: "Qishloq aholisining soni viloyat bo'ysunuvidagi shahar toifasi uchun yetarli emas." },
                    { pts: "20", text: "Maxsus komissiya xulosa berish muddatini mustaqil uzaytirishi va u 1 oydan oshishi." },
                    { pts: "25", text: "Viloyat hokimining 'qaror qabul qilishi' (Kengash qarori kerak)." },
                    { pts: "30", text: "Kartografik chizmalarning Vazirlar Mahkamasi tomonidan tayyorlanishi (Kadastr vakolati)." }
                ],
                law: "Ma'muriy-hududiy tuzilish to'g'rsidagi: 3, 11, 14, 34-moddalar."
            },
            {
                question: "Qoraqalpog'iston Respublikasi Vazirlar Kengashi hududda yangi tuman tuzish bo'yicha taklif tayyorlab, tasdiqlash uchun to'g'ridan-to'g'ri Oliy Majlisga yubordi. Oliy Majlis 30 kun ichida uzil-kesil qarorni qabul qildi. Qaror chiqqanidan so'ng, yangi tumanda saylov okruglarini o'zgartirish masalasi ko'rib chiqildi va Vazirlar Kengashi 15 ish kuni ichida ma'lumotlarni Davlat reyestriga kiritish uchun Kadastr agentligiga taqdim etdi.",
                errorsList: [
                    { pts: "15", text: "Hujjatlarni to'g'ridan-to'g'ri Oliy Majlisga yuborish (Jo'qorg'i Kengesga emas)." },
                    { pts: "20", text: "Oliy Majlisning yakuniy qaror qabul qilishi (u faqat rozilik beradi)." },
                    { pts: "25", text: "Davlat reyestriga kiritish muddatining buzilishi (uzog'i 10 kun)." },
                    { pts: "30", text: "Saylov okruglari masalasini Oliy Majlis qarori chiqqanidan keyin hal qilinishi." }
                ],
                law: "Ma'muriy-hududiy tuzilish to'g'rsidagi: 15, 19, 40-1-moddalar."
            },
            {
                question: "Tuman hokimi aholisi 1800 kishi bo'lgan, sanoat korxonasi yo'q qishloqni 'shaharcha' toifasiga kiritish iltimosnomasini tayyorladi. Komissiya loyihaga salbiy xulosa bergan bo'lsa-da, hokim jarayonni bevosita xalq deputatlari tuman Kengashiga kiritdi. Tuman Kengashi ijobiy qaror qabul qilib, navbatchi xaritalarga tushirish uchun viloyat hokimligiga topshiriq berdi.",
                errorsList: [
                    { pts: "15", text: "Qishloqning aholi soni va infratuzilmasi shaharcha talablariga javob bermasligi." },
                    { pts: "20", text: "Salbiy xulosa olingan loyihaning jarayonini davom ettirish." },
                    { pts: "25", text: "Qishloqni shaharchaga o'tkazishni tuman Kengashi hal qilishi (viloyat Kengashi vakolati)." },
                    { pts: "30", text: "Navbatchi xaritalarni yuritish viloyat hokimligiga topshirilishi." }
                ],
                law: "Ma'muriy-hududiy tuzilish to'g'rsidagi: 3, 11, 14, 38-moddalar."
            },
            {
                question: "Tuman hokimi tuman markazini ko'chirish niyatida qarorni tezlashtirish uchun to'g'ridan-to'g'ri Vazirlar Mahkamasiga iltimosnoma kiritdi. Iltimosnomaga hokimlik tasdiqlagan chegaralar chizig'i ilova qilindi. Vazirlar Mahkamasi taklifni 45 kunda ma'qulladi. Tuman markazi ko'chirilgach, nizoli uchastkalarga aniqlik kiritish to'g'ridan-to'g'ri tuman hokimligiga topshirildi.",
                errorsList: [
                    { pts: "15", text: "Iltimosnoma noto'g'ri organga (Vazirlar Mahkamasiga) yuborilgani." },
                    { pts: "20", text: "Chegaralar chizig'i hokimlik tomonidan tayyorlanib tasdiqlangani." },
                    { pts: "25", text: "Davlat organining ko'rib chiqish muddatini buzishi (30 kun o'rniga 45 kun)." },
                    { pts: "30", text: "Nizoli uchastkalarga aniqlik kiritish hokimlikka topshirilgani (Kadastr vakolati)." }
                ],
                law: "Ma'muriy-hududiy tuzilish to'g'risidagi: 11, 31-moddalar."
            }
        ];

        const teamConfigs = [
            { id: 1, name: "1-JAMOA", color: "indigo" },
            { id: 2, name: "2-JAMOA", color: "blue" },
            { id: 3, name: "3-JAMOA", color: "orange" },
            { id: 5, name: "5-JAMOA", color: "purple" }
        ];

        // --- 4. DASTUR MANTIQI ---
        let scenarios = [];
        let timeLeft = 180;
        let isActive = false;
        let isFinished = false;
        let timerInterval = null;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function init() {
            // Savollar har safar yuklanganda aralashadi
            const selected = shuffle([...questionPool]);
            scenarios = teamConfigs.map((team, i) => ({ ...team, ...selected[i] }));
            renderCards();
            updateTimerDisplay();
        }

        function toggleTimer() {
            soundManager.click();
            isActive ? pauseTimer() : startTimer();
        }

        function startTimer() {
            if (timeLeft <= 0) return;
            soundManager.init(); 
            isActive = true;
            document.getElementById('iconPlay').classList.add('hidden');
            document.getElementById('iconPause').classList.remove('hidden');
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    if (timeLeft <= 10) soundManager.warning();
                    else if (timeLeft % 30 === 0) soundManager.tick();
                    updateTimerDisplay();
                } else {
                    soundManager.alarm();
                    finishTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isActive = false;
            clearInterval(timerInterval);
            document.getElementById('iconPlay').classList.remove('hidden');
            document.getElementById('iconPause').classList.add('hidden');
        }

        function finishTimer() {
            pauseTimer();
            timeLeft = 0;
            isFinished = true;
            updateTimerDisplay();
            updateCardsToFinishedState();
        }

        function finishEarly() { if (!isFinished) finishTimer(); }

        function adjustTime(s) {
            if (isActive) return;
            timeLeft = Math.max(0, timeLeft + s);
            isFinished = false;
            updateTimerDisplay();
        }

        function resetApp() {
            pauseTimer();
            timeLeft = 180;
            isFinished = false;
            init();
        }

        function toggleFullScreen() {
            soundManager.click();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const el = document.getElementById('timerDisplay');
            el.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            if (timeLeft === 0) {
                el.className = "text-4xl md:text-5xl font-black font-mono tracking-tighter px-4 min-w-[140px] text-center timer-critical";
            } else if (timeLeft <= 10) {
                el.className = "text-4xl md:text-5xl font-black font-mono tracking-tighter px-4 min-w-[140px] text-center text-red-400";
            } else {
                el.className = "text-4xl md:text-5xl font-black font-mono tracking-tighter px-4 min-w-[140px] text-center text-white";
            }
        }

        function getTeamStyle(color) {
            const styles = {
                indigo: { grad: 'from-indigo-600 to-slate-900', border: 'border-indigo-500/30' },
                blue: { grad: 'from-blue-600 to-slate-900', border: 'border-blue-500/30' },
                orange: { grad: 'from-orange-600 to-slate-900', border: 'border-orange-500/30' },
                purple: { grad: 'from-purple-600 to-slate-900', border: 'border-purple-500/30' },
            };
            return styles[color];
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            scenarios.forEach((item, index) => {
                const style = getTeamStyle(item.color);
                const delay = index * 100;
                
                // Javoblar bloki yig'ilishi
                let errorsHTML = item.errorsList.map(err => `
                    <div class="flex items-start gap-3 bg-white/5 p-2 rounded border border-white/5">
                        <span class="bg-red-500/20 text-red-400 font-mono font-bold px-2 py-0.5 rounded text-sm shrink-0">${err.pts} ball</span>
                        <p class="text-slate-200 text-sm md:text-base leading-snug">${err.text}</p>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div id="card-${item.id}" 
                         style="animation-delay: ${delay}ms"
                         class="card-enter flex flex-col relative h-full bg-gradient-to-br ${style.grad} rounded-2xl border ${style.border} overflow-hidden shadow-2xl transition-all duration-300">
                        
                        <div class="px-5 py-4 bg-black/20 backdrop-blur-sm border-b border-white/5 flex justify-between items-center z-10">
                            <h2 class="font-black text-xl uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-white/70">${item.name}</h2>
                            <span class="bg-white/10 px-3 py-1 rounded text-xs font-bold text-white/70 border border-white/5">KAZUS №${item.id}</span>
                        </div>
                        
                        <div class="flex-1 p-5 md:p-6 flex flex-col z-10 overflow-y-auto">
                            
                            <!-- QUESTION -->
                            <div id="question-${item.id}" class="h-full flex items-center transition-all duration-500">
                                <p class="text-base md:text-lg font-medium text-slate-100 leading-relaxed text-justify">
                                    ${item.question}
                                </p>
                            </div>

                            <!-- ANSWER (Hidden initially) -->
                            <div id="answer-${item.id}" class="hidden flex-col gap-3">
                                <div class="bg-black/40 p-4 rounded-xl border border-red-500/30 shadow-lg">
                                    <h3 class="text-red-400 font-bold uppercase text-xs tracking-wider mb-3">Xatolar va Ballar (Jami: 4 ta)</h3>
                                    <div class="flex flex-col gap-2">
                                        ${errorsHTML}
                                    </div>
                                </div>
                                <div class="bg-yellow-500/10 p-3 mt-2 rounded-xl border-l-4 border-yellow-500">
                                    <span class="text-yellow-400 font-bold uppercase text-xs tracking-wider block mb-1">Huquqiy Asos:</span>
                                    <span class="text-sm text-yellow-100 font-mono font-medium">${item.law}</span>
                                </div>
                            </div>
                        </div>

                        <div id="footer-${item.id}" class="bg-black/30 p-4 border-t border-white/5 z-10">
                            <!-- Empty footer placeholder until time is up -->
                        </div>
                    </div>
                `;
            });
        }

        function updateCardsToFinishedState() {
            scenarios.forEach(item => {
                const footer = document.getElementById(`footer-${item.id}`);
                footer.innerHTML = `
                    <button onclick="revealAnswer(${item.id}, this)" class="w-full bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-green-900/30 transform transition-all active:scale-95 flex items-center justify-center gap-2 uppercase tracking-wider border border-green-400/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        JAVOBNI KO'RISH 
                    </button>
                `;
            });
        }

        function revealAnswer(id, btn) {
            soundManager.success(); 
            
            const card = document.getElementById(`card-${id}`);
            const rect = btn.getBoundingClientRect();
            
            confetti.spawn(rect.left + rect.width/2, rect.top);

            document.getElementById(`question-${id}`).classList.add('hidden');
            const answerDiv = document.getElementById(`answer-${id}`);
            answerDiv.classList.remove('hidden');
            answerDiv.classList.add('flex', 'answer-reveal');

            // Button becomes invisible/inactive after click
            btn.style.display = 'none';

            card.classList.remove('from-indigo-600', 'from-blue-600', 'from-orange-600', 'from-purple-600');
            card.className = "flex flex-col relative h-full bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl transition-all duration-500";
        }

        // Initially DO NOT call init(), wait for login
    </script>
</body>
</html>
