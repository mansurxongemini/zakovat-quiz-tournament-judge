<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'zbekiston Puzzle - Pro Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
        }

        /* 3D Button Effect */
        .team-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            top: 0;
        }

        .team-btn:active {
            top: 4px;
            box-shadow: 0 0px 0 0 #e5e7eb;
        }

        /* Active State Animation */
        .team-btn.active {
            background: linear-gradient(to bottom right, #22c55e, #16a34a);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.4), 0 4px 6px -2px rgba(34, 197, 94, 0.2);
            border-color: #15803d;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Reveal Animation */
        .reveal-anim {
            animation: slideUpFade 0.6s ease-out forwards;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        /* Map Image Containment */
        .map-image-contain {
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden bg-blue-50">

    <!-- OYIN OYNASI -->
    <div id="game-screen" class="w-full max-w-lg h-full md:h-auto md:max-h-[95vh] glass-panel rounded-3xl shadow-2xl flex flex-col items-center p-6 relative border-t-4 border-blue-500 overflow-y-auto">
        
        <!-- Header -->
        <div class="w-full flex justify-between items-center mb-4 border-b pb-4 border-gray-100">
            <div>
                <h1 class="text-xl font-extrabold text-blue-900 uppercase tracking-widest">Puzzle Map</h1>
                <p class="text-gray-400 text-xs font-semibold tracking-wide">O'zbekiston bo'ylab sayohat</p>
            </div>
            <div class="bg-blue-100 text-blue-800 px-4 py-2 rounded-lg font-bold text-sm shadow-inner">
                Savol: <span id="question-counter" class="text-lg">1</span><span class="text-blue-400">/14</span>
            </div>
        </div>

        <!-- Savol Matni -->
        <div class="text-center mb-4">
            <h2 class="text-xl font-bold text-gray-800" id="question-text">Bu qaysi hudud?</h2>
            <p class="text-xs text-gray-500 mt-1">Xaritadagi shaklga qarab toping!</p>
        </div>

        <!-- 1. RASM QISMI (Hozir doim ko'rinadi) -->
        <div id="image-container" class="w-full h-56 bg-white rounded-2xl flex items-center justify-center mb-6 relative overflow-hidden border border-gray-200 shadow-inner p-4">
            
            <!-- Asl Rasm (Endi doim ko'rinadi) -->
            <img 
                id="region-image" 
                src="" 
                alt="Hudud Rasmi" 
                class="w-full h-full map-image-contain transition-all duration-500 transform hover:scale-105"
            >
            
            <!-- Hudud Nomi (Boshida yashirin, Javob bosilganda chiqadi) -->
            <div id="region-name-overlay" class="absolute inset-0 bg-blue-900 bg-opacity-90 flex items-center justify-center hidden backdrop-blur-sm transition-all duration-300">
                <h2 id="region-name-display" class="text-2xl font-bold text-white tracking-wider text-center px-4">Hudud Nomi</h2>
            </div>
        </div>

        <!-- 2. JAMOA TANLASH (Random & Fair) -->
        <div class="w-full mb-6">
            <p class="text-center text-xs font-bold text-gray-400 mb-2 uppercase">Javob beruvchi jamoa:</p>
            <div class="flex justify-center gap-4 md:gap-6">
                <button onclick="manualSelect(1)" id="btn-1" class="team-btn w-14 h-14 rounded-xl border-b-4 border-gray-300 bg-white text-xl font-black text-gray-600 flex items-center justify-center shadow-md hover:bg-gray-50">1</button>
                <button onclick="manualSelect(2)" id="btn-2" class="team-btn w-14 h-14 rounded-xl border-b-4 border-gray-300 bg-white text-xl font-black text-gray-600 flex items-center justify-center shadow-md hover:bg-gray-50">2</button>
                <button onclick="manualSelect(3)" id="btn-3" class="team-btn w-14 h-14 rounded-xl border-b-4 border-gray-300 bg-white text-xl font-black text-gray-600 flex items-center justify-center shadow-md hover:bg-gray-50">3</button>
                <button onclick="manualSelect(4)" id="btn-4" class="team-btn w-14 h-14 rounded-xl border-b-4 border-gray-300 bg-white text-xl font-black text-gray-600 flex items-center justify-center shadow-md hover:bg-gray-50">4</button>
            </div>
        </div>

        <!-- Javobni Ko'rsatish Tugmasi -->
        <button onclick="showAnswer()" id="show-answer-btn" class="mb-6 px-8 py-3 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-200 transition flex items-center gap-2 transform active:scale-95 w-full justify-center">
            <i class="fas fa-eye"></i> Javobni Tekshirish
        </button>

        <!-- 3. TO'G'RI (Check) TUGMASI -->
        <div class="w-full flex justify-between items-center mt-auto pt-4 border-t border-gray-100">
            <button onclick="skipQuestion()" class="text-gray-400 hover:text-red-500 font-semibold text-sm transition px-4 flex items-center gap-1">
                <i class="fas fa-forward"></i> O'tkazish
            </button>
            
            <button onclick="submitAnswer()" class="check-btn bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white w-20 h-20 rounded-full shadow-xl shadow-green-200 flex items-center justify-center text-4xl border-4 border-white ring-4 ring-green-50 transition transform hover:rotate-12 hover:scale-110">
                <i class="fas fa-check"></i>
            </button>

            <div class="w-20 text-right">
                 <!-- Bo'sh joy -->
            </div>
        </div>

    </div>

    <!-- NATIJALAR OYNASI -->
    <div id="result-screen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-4 overflow-y-auto">
        <div class="w-full max-w-4xl flex flex-col items-center py-8">
            <div class="text-center mb-6 animate-bounce">
                <i class="fas fa-trophy text-yellow-400 text-6xl drop-shadow-lg"></i>
            </div>
            <h2 class="text-4xl font-extrabold text-blue-900 mb-2">O'yin Yakunlandi!</h2>
            <p class="text-gray-500 mb-8">Barcha hududlar o'rganildi</p>
            
            <!-- O'zbekiston Umumiy Xaritasi (KATTALASHTIRILDI) -->
            <div class="w-full h-96 mb-10 rounded-3xl shadow-2xl border-4 border-white overflow-hidden bg-blue-50 flex items-center justify-center p-4">
                <img src="https://gadm.org/img/480/gadm/UZB/UZB_labs.png" class="w-full h-full object-contain hover:scale-110 transition-transform duration-700" alt="O'zbekiston Xaritasi">
            </div>

            <!-- Yakuniy Ballar -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-blue-500 flex flex-col items-center justify-center">
                    <span class="font-bold text-gray-500 mb-2">1-Jamoa</span>
                    <span class="text-4xl font-black text-blue-600" id="score-1">0</span>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-red-500 flex flex-col items-center justify-center">
                    <span class="font-bold text-gray-500 mb-2">2-Jamoa</span>
                    <span class="text-4xl font-black text-red-600" id="score-2">0</span>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-yellow-500 flex flex-col items-center justify-center">
                    <span class="font-bold text-gray-500 mb-2">3-Jamoa</span>
                    <span class="text-4xl font-black text-yellow-600" id="score-3">0</span>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-green-500 flex flex-col items-center justify-center">
                    <span class="font-bold text-gray-500 mb-2">4-Jamoa</span>
                    <span class="text-4xl font-black text-green-600" id="score-4">0</span>
                </div>
            </div>

            <button onclick="location.reload()" class="px-10 py-4 bg-gray-900 text-white rounded-2xl hover:bg-black transition font-bold shadow-2xl flex items-center gap-3 text-lg">
                <i class="fas fa-redo-alt"></i> Qayta Boshlash
            </button>
        </div>
    </div>

    <script>
        // MA'LUMOTLAR BAZASI
        const regions = [
            { name: "Andijon viloyati", image: "https://gadm.org/img/480/gadm/UZB/andijon/UZB_andijon.png" },
            { name: "Buxoro viloyati", image: "https://gadm.org/img/480/gadm/UZB/bukhoro/UZB_bukhoro.png" },
            { name: "Farg'ona viloyati", image: "https://gadm.org/img/480/gadm/UZB/ferghana/UZB_ferghana.png" },
            { name: "Jizzax viloyati", image: "https://gadm.org/img/480/gadm/UZB/jizzakh/UZB_jizzakh.png" },
            { name: "Xorazm viloyati", image: "https://gadm.org/img/480/gadm/UZB/khorezm/UZB_khorezm.png" },
            { name: "Namangan viloyati", image: "https://gadm.org/img/480/gadm/UZB/namangan/UZB_namangan.png" },
            { name: "Navoiy viloyati", image: "https://gadm.org/img/480/gadm/UZB/navoi/UZB_navoi.png" },
            { name: "Qashqadaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/kashkadarya/UZB_kashkadarya.png" },
            { name: "Qoraqalpog'iston Respublikasi", image: "https://gadm.org/img/480/gadm/UZB/karakalpakstan/UZB_karakalpakstan.png" },
            { name: "Samarqand viloyati", image: "https://gadm.org/img/480/gadm/UZB/samarkand/UZB_samarkand.png" },
            { name: "Sirdaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/sirdaryo/UZB_sirdaryo.png" },
            { name: "Surxondaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/surkhandarya/UZB_surkhandarya.png" },
            { name: "Toshkent viloyati", image: "https://gadm.org/img/480/gadm/UZB/tashkent/UZB_tashkent.png" },
            { name: "Toshkent shahri", image: "https://gadm.org/img/480/gadm/UZB/tashkentcity/UZB_tashkentcity.png" }
        ];

        // O'YIN STATE
        let currentQuestionIndex = 0;
        let activeTeam = 1;
        let scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
        let turnQueue = []; 

        // Elementlar
        const questionCounterEl = document.getElementById('question-counter');
        const regionNameDisplayEl = document.getElementById('region-name-display');
        const regionImageEl = document.getElementById('region-image');
        const regionNameOverlayEl = document.getElementById('region-name-overlay');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const showAnswerBtn = document.getElementById('show-answer-btn');

        initGame();

        function initGame() {
            shuffleArray(regions);
            currentQuestionIndex = 0;
            updateQuestionUI();
            setNextRandomTeam();
        }

        function setNextRandomTeam() {
            if (turnQueue.length === 0) {
                turnQueue = [1, 2, 3, 4];
                shuffleArray(turnQueue);
            }
            const nextTeam = turnQueue.pop();
            highlightTeam(nextTeam);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function highlightTeam(teamId) {
            activeTeam = teamId;
            document.querySelectorAll('.team-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${teamId}`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function manualSelect(teamId) {
            highlightTeam(teamId);
        }

        function showAnswer() {
            const currentRegion = regions[currentQuestionIndex];
            regionNameDisplayEl.innerText = currentRegion.name;
            
            // Faqat nomni ko'rsatish (overlay), rasm allaqachon ko'rinib turibdi
            regionNameOverlayEl.classList.remove('hidden');
            regionNameOverlayEl.classList.add('reveal-anim');
            
            showAnswerBtn.classList.add('opacity-50', 'cursor-not-allowed');
            showAnswerBtn.disabled = true;
        }

        function submitAnswer() {
            scores[activeTeam] += 100;
            nextQuestion();
        }

        function skipQuestion() {
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < regions.length) {
                resetAnswerUI();
                updateQuestionUI();
                setNextRandomTeam(); 
            } else {
                finishGame();
            }
        }

        function resetAnswerUI() {
            // Overlayni yashirish (nomni bekitish)
            regionNameOverlayEl.classList.add('hidden');
            regionNameOverlayEl.classList.remove('reveal-anim');
            
            // Tugmani qayta yoqish
            showAnswerBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            showAnswerBtn.disabled = false;
        }

        function updateQuestionUI() {
            questionCounterEl.innerText = currentQuestionIndex + 1;
            
            // Yangi rasmni darhol yuklash
            const currentRegion = regions[currentQuestionIndex];
            regionImageEl.src = currentRegion.image;
        }

        function finishGame() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            document.getElementById('score-1').innerText = scores[1];
            document.getElementById('score-2').innerText = scores[2];
            document.getElementById('score-3').innerText = scores[3];
            document.getElementById('score-4').innerText = scores[4];
        }
    </script>
</body>
</html>
