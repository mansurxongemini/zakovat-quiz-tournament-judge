<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma'muriy Hududiy O'zgarishlar (PRO)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; }

        /* Glassmorphism */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animations */
        .card-enter { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        .answer-reveal { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.9); } 
            100% { opacity: 1; transform: scale(1); } 
        }
        @keyframes pulse-critical {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
        }

        .timer-critical { 
            color: #ef4444; 
            animation: pulse-critical 1.5s infinite;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-[#0B1120] text-slate-100 min-h-screen flex flex-col relative overflow-y-auto selection:bg-blue-500 selection:text-white">

    <canvas id="confetti-canvas"></canvas>

    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass border-b-0 shadow-2xl transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-3 md:px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-cyan-600 rounded-lg blur opacity-40 group-hover:opacity-75 transition duration-200"></div>
                    <div class="relative bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                    </div>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400 uppercase">MA'MURIY SUD PROCESSI</h1>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <p class="text-xs text-slate-400 font-medium tracking-wide">JONLI EFIR</p>
                    </div>
                </div>
            </div>

            <!-- Timer & Controls -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between bg-slate-800/50 p-1.5 rounded-2xl border border-slate-700/50 backdrop-blur-md">
                
                <!-- Time Adjust -->
                <div class="flex flex-col gap-0.5 px-1">
                    <button onclick="soundManager.click(); adjustTime(60)" class="text-[10px] font-bold text-green-400 hover:bg-slate-700/50 px-2 py-0.5 rounded transition">+1 MIN</button>
                    <button onclick="soundManager.click(); adjustTime(-60)" class="text-[10px] font-bold text-red-400 hover:bg-slate-700/50 px-2 py-0.5 rounded transition">-1 MIN</button>
                </div>

                <!-- Main Clock -->
                <div id="timerDisplay" class="text-4xl md:text-5xl font-black font-mono tracking-tighter text-white px-4 min-w-[140px] text-center" style="font-variant-numeric: tabular-nums;">
                    03:00
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-1 pr-1">
                    <button id="btnStart" onclick="toggleTimer()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-blue-600 hover:bg-blue-500 text-white shadow-lg active:scale-95 transition-all group">
                        <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="iconPause" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden fill-current animate-pulse" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    
                    <button onclick="soundManager.error(); finishEarly()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-700 hover:bg-red-600 hover:text-white text-slate-300 transition-all active:scale-95" title="Tugatish">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                        </svg>
                    </button>

                    <button onclick="soundManager.click(); resetApp()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all active:scale-95" title="Qayta yuklash">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>

                    <button onclick="toggleFullScreen()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all active:scale-95" title="To'liq ekran">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main id="cardsContainer" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 p-4 md:p-6 max-w-8xl mx-auto w-full pb-20">
        <!-- Cards rendered by JS -->
    </main>

    <!-- FOOTER STATUS -->
    <footer class="fixed bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur text-center py-2 border-t border-slate-800 z-30">
        <p class="text-xs text-slate-500 font-mono">SYSTEM READY • AUDIO ENABLED • V1.0.0</p>
    </footer>

    <script>
        // --- 1. PROFESSIONAL OVOZ TIZIMI (AudioContext) ---
        const soundManager = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function(freq, type, duration, vol = 0.1) {
                if (!this.ctx) this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            click: function() { this.playTone(800, 'sine', 0.1, 0.05); },
            tick: function() { this.playTone(1000, 'square', 0.05, 0.03); },
            warning: function() { this.playTone(600, 'sawtooth', 0.1, 0.05); },
            alarm: function() {
                if (!this.ctx) this.init();
                const now = this.ctx.currentTime;
                [440, 330, 440, 330].forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0.2, now + i * 0.2);
                    gain.gain.linearRampToValueAtTime(0, now + i * 0.2 + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.2);
                    osc.stop(now + i * 0.2 + 0.2);
                });
            },
            success: function() {
                if (!this.ctx) this.init();
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0.1, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.5);
                });
            },
            error: function() { this.playTone(150, 'sawtooth', 0.3, 0.2); }
        };

        // --- 2. KONFETTI TIZIMI ---
        const confetti = {
            canvas: document.getElementById('confetti-canvas'),
            ctx: document.getElementById('confetti-canvas').getContext('2d'),
            particles: [],
            isActive: false,
            init: function() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize: function() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },
            spawn: function(x, y) {
                for(let i=0; i<50; i++) {
                    this.particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 1) * 15,
                        color: `hsl(${Math.random()*360}, 100%, 50%)`,
                        size: Math.random() * 8 + 4,
                        life: 100
                    });
                }
                if (!this.isActive) {
                    this.isActive = true;
                    this.loop();
                }
            },
            loop: function() {
                if (this.particles.length === 0) {
                    this.isActive = false;
                    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
                    return;
                }
                this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
                for(let i=this.particles.length-1; i>=0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5; // Gravity
                    p.life--;
                    p.size *= 0.95;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    this.ctx.fill();
                    if(p.life <= 0) this.particles.splice(i, 1);
                }
                requestAnimationFrame(() => this.loop());
            }
        };
        confetti.init();

        // --- 3. MA'LUMOTLAR BAZASI ---
        const questionPool = [
             {
                question: "Buxoro va Navoiy hokimlari suv ombori hududini almashish bo'yicha 'Memorandum' imzoladi. Bu hujjat chegarani o'zgartirish uchun asos bo'la oladimi?",
                answer: "YO'Q. Memorandum yuridik kuchga ega emas. Chegarani o'zgartirish faqat SENAT qarori bilan, Vazirlar Mahkamasi taklifiga binoan amalga oshiriladi.",
                law: "Konstitutsiya 81-modda; Ma'muriy-hududiy tuzilish qonuni"
            },
            {
                question: "Toshkent shahrida 'Yangi Avlod' tumani tuzilmoqda. Shahar Kengashi 'Davlat ehtiyoji' sababli aholi fikrini o'rganishni rad etdi. Bu to'g'rimi?",
                answer: "NOQONUNIY. Qonunning 6-moddasiga ko'ra, aholi fikrini hisobga olish majburiy (imperativ) talabdir. 'Davlat ehtiyoji' bu tartibni bekor qilmaydi.",
                law: "Ma'muriy-hududiy tuzilish qonuni, 6-modda"
            },
            {
                question: "Vazirlar Mahkamasi o'z qarori bilan Farg'ona tumanini 'Maxsus zona' deb e'lon qilib, uning chegarasini o'zgartirdi. Bu qaror kuchga egami?",
                answer: "G'AYRIKONSTITUTSIYAVIY. Vazirlar Mahkamasi ijro organi bo'lib, hududiy chegaralarni o'zgartirish vakolatiga ega emas. Bu faqat Oliy Majlis Senati vakolatida.",
                law: "Konstitutsiya 81-modda"
            },
            {
                question: "Xalq deputatlari Xorazm viloyat Kengashi Urganch tumaniga 'Jaloliddin Manguberdi' nomini berish haqida uzil-kesil qaror qabul qildi. Xato qayerda?",
                answer: "VAKOLAT BUZILDI. Viloyat Kengashi nom berish bo'yicha qaror emas, faqat ILTIMOSNOMA kiritishi mumkin. Nom berish Senat qarori bilan bo'ladi.",
                law: "Geografik obyektlar nomlari to'g'risida qonun"
            },
            {
                question: "Andijon viloyati tarkibida bo'lgan 'Xonobod' shahrini viloyat bo'ysunuvidagi shaharlar ro'yxatidan chiqarib, tuman bo'ysunuviga o'tkazishni kim hal qiladi?",
                answer: "OLIY MAJLIS SENATI. Viloyat bo'ysunuvidagi shaharlar toifasini o'zgartirish Prezident farmoni emas, Senat qarori bilan amalga oshiriladi.",
                law: "Ma'muriy-hududiy tuzilish to'g'risida qonun, 18-modda"
            },
            {
                question: "Surxondaryo viloyati Termiz shahrining 'Do'stlik' mahallasini Termiz tumaniga o'tkazish uchun Senat qarori shartmi?",
                answer: "SHART EMAS. Mahalla (shahar ichidagi chegara) chegaralarini o'zgartirish Xalq deputatlari shahar va tuman Kengashlari vakolatiga kiradi, Senatga chiqmaydi.",
                law: "O'zini o'zi boshqarish organlari to'g'risida qonun"
            },
            {
                question: "Prezident Farmoni bilan Sirdaryo viloyatida 'Erkin iqtisodiy zona' tashkil etildi va unga alohida ma'muriy maqom berildi. Bu yangi tuman tuzildi deganimi?",
                answer: "YO'Q. Iqtisodiy maqom (EIZ) ma'muriy-hududiy birlik (tuman/shahar) tuzilganini anglatmaydi. Tuman tuzish uchun alohida Senat qarori kerak.",
                law: "Ma'muriy-hududiy tuzilish va EIZ to'g'risidagi qonunlar"
            },
            {
                question: "Fuqarolar tashabbuskor guruhi tumanni ikkiga bo'lish bo'yicha referendum o'tkazishni talab qilmoqda. Bu referendum natijasi qonuniy kuchga egami?",
                answer: "YO'Q. Ma'muriy chegaralar masalasi mahalliy referendum predmeti bo'la olmaydi. Aholi fikri yig'ilishlar orqali olinadi, lekin referendum orqali hal qilinmaydi.",
                law: "O'zbekiston Respublikasining Referendumi to'g'risidagi qonun"
            },
            {
                question: "Qashqadaryo viloyat hokimi 'Optimallashtirish' dasturi doirasida ikki qishloq fuqarolar yig'inini birlashtirish haqida qaror chiqardi. Hokim haqlimi?",
                answer: "HAQLI EMAS. Fuqarolar yig'inlarini (QFY/MFY) tuzish va tugatish Xalq deputatlari tuman Kengashi vakolatidir, hokimning yakka tartibdagi qarori bilan emas.",
                law: "Fuqarolar yig'ini raisi saylovi to'g'risida qonun"
            },
            {
                question: "Toshkent viloyati markazini Nurafshon shahridan boshqa shahar ko'chirish taklifi berildi. Bu qarorni viloyat hokimi qabul qiladimi?",
                answer: "YO'Q. Viloyat ma'muriy markazini belgilash yoki ko'chirish Oliy Majlis Senati tomonidan, Vazirlar Mahkamasi taklifiga binoan amalga oshiriladi.",
                law: "Ma'muriy-hududiy tuzilish to'g'risida qonun, 5-modda"
            },
            {
                question: "So'x tumanining (eksklav) chegaralarini kengaytirish bo'yicha O'zbekiston Senati bir tomonlama qaror qabul qildi. Bu yuridik jihatdan yetarlimi?",
                answer: "YETARLI EMAS. Davlat chegarasini o'zgartirish xalqaro shartnomalarni talab qiladi. Ma'muriy qonunchilikdan tashqari, Davlat chegarasi to'g'risidagi qonun va xalqaro kelishuv shart.",
                law: "O'zbekiston Respublikasining Davlat chegarasi to'g'risida qonun"
            },
            {
                question: "Yangi tashkil etilgan tumanga 'Turon' nomini berish uchun aholidan so'rovnoma o'tkazildi, 80% qarshi chiqdi. Senat baribir shu nomni tasdiqlay oladimi?",
                answer: "HA, TASDIQLAY OLADI. Qonunga ko'ra, aholi fikri 'inobatga olinadi', lekin bu veto qo'yish huquqini bermaydi. Yakuniy qaror davlat manfaatlari asosida Senatda qoladi.",
                law: "Geografik obyektlarning nomlari to'g'risida qonun"
            }
        ];

        const teamConfigs = [
            { id: 1, name: "1-JAMOA", color: "indigo" },
            { id: 2, name: "2-JAMOA", color: "blue" },
            { id: 3, name: "3-JAMOA", color: "orange" },
            { id: 5, name: "5-JAMOA", color: "purple" }
        ];

        // --- 4. DASTUR MANTIQI ---
        let scenarios = [];
        let timeLeft = 180;
        let isActive = false;
        let isFinished = false;
        let timerInterval = null;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function init() {
            const selected = shuffle([...questionPool]).slice(0, 4);
            scenarios = teamConfigs.map((team, i) => ({ ...team, ...selected[i] }));
            renderCards();
            updateTimerDisplay();
        }

        function toggleTimer() {
            soundManager.click();
            isActive ? pauseTimer() : startTimer();
        }

        function startTimer() {
            if (timeLeft <= 0) return;
            soundManager.init(); // AudioContext ni faollashtirish
            isActive = true;
            document.getElementById('iconPlay').classList.add('hidden');
            document.getElementById('iconPause').classList.remove('hidden');
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    // Ovozli effektlar
                    if (timeLeft <= 10) soundManager.warning(); // Oxirgi 10 soniyada signal
                    else if (timeLeft % 30 === 0) soundManager.tick(); // Har 30 sekunda tik
                    
                    updateTimerDisplay();
                } else {
                    soundManager.alarm();
                    finishTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isActive = false;
            clearInterval(timerInterval);
            document.getElementById('iconPlay').classList.remove('hidden');
            document.getElementById('iconPause').classList.add('hidden');
        }

        function finishTimer() {
            pauseTimer();
            timeLeft = 0;
            isFinished = true;
            updateTimerDisplay();
            updateCardsToFinishedState();
        }

        function finishEarly() { if (!isFinished) finishTimer(); }

        function adjustTime(s) {
            if (isActive) return;
            timeLeft = Math.max(0, timeLeft + s);
            isFinished = false;
            updateTimerDisplay();
        }

        function resetApp() {
            pauseTimer();
            timeLeft = 180;
            isFinished = false;
            init();
        }

        function toggleFullScreen() {
            soundManager.click();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const el = document.getElementById('timerDisplay');
            el.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            if (timeLeft === 0) {
                el.className = "text-4xl md:text-5xl font-black font-mono tracking-tighter px-4 min-w-[140px] text-center timer-critical";
            } else if (timeLeft <= 10) {
                el.className = "text-4xl md:text-5xl font-black font-mono tracking-tighter px-4 min-w-[140px] text-center text-red-400";
            } else {
                el.className = "text-4xl md:text-5xl font-black font-mono tracking-tighter px-4 min-w-[140px] text-center text-white";
            }
        }

        function getTeamStyle(color) {
            const styles = {
                indigo: { grad: 'from-indigo-600 to-slate-900', border: 'border-indigo-500/30' },
                blue: { grad: 'from-blue-600 to-slate-900', border: 'border-blue-500/30' },
                orange: { grad: 'from-orange-600 to-slate-900', border: 'border-orange-500/30' },
                purple: { grad: 'from-purple-600 to-slate-900', border: 'border-purple-500/30' },
            };
            return styles[color];
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            scenarios.forEach((item, index) => {
                const style = getTeamStyle(item.color);
                
                // Animation delay for stagger effect
                const delay = index * 100;
                
                container.innerHTML += `
                    <div id="card-${item.id}" 
                         style="animation-delay: ${delay}ms"
                         class="card-enter flex flex-col relative h-full bg-gradient-to-br ${style.grad} rounded-2xl border ${style.border} overflow-hidden shadow-2xl hover:shadow-blue-900/20 transition-all duration-300 group">
                        
                        <!-- Decoration Lines -->
                        <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>

                        <!-- Header -->
                        <div class="px-5 py-4 bg-black/20 backdrop-blur-sm border-b border-white/5 flex justify-between items-center z-10">
                            <h2 class="font-black text-2xl uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-white/70">${item.name}</h2>
                            <span class="bg-white/10 px-3 py-1 rounded text-xs font-bold text-white/70 border border-white/5">KAZUS №${item.id}</span>
                        </div>
                        
                        <!-- Body -->
                        <div class="flex-1 p-6 flex flex-col justify-center relative z-10">
                            
                            <!-- QUESTION -->
                            <div id="question-${item.id}" class="h-full flex items-center transition-all duration-500">
                                <p class="text-xl md:text-2xl font-bold text-slate-100 leading-snug drop-shadow-md">
                                    ${item.question}
                                </p>
                            </div>

                            <!-- ANSWER -->
                            <div id="answer-${item.id}" class="hidden h-full flex flex-col justify-center gap-4">
                                <div class="relative bg-black/40 p-5 rounded-xl border border-green-500/30 shadow-lg backdrop-blur-md">
                                    <div class="absolute -top-3 -left-3 bg-green-500 text-black text-xs font-black px-2 py-1 rounded shadow-lg transform -rotate-2">TO'G'RI JAVOB</div>
                                    <p class="text-xl md:text-2xl font-bold text-white leading-relaxed">
                                        ${item.answer}
                                    </p>
                                </div>
                                <div class="bg-yellow-500/10 p-4 rounded-xl border-l-4 border-yellow-500">
                                    <span class="text-yellow-400 font-bold uppercase text-xs tracking-wider block mb-1">Huquqiy Asos:</span>
                                    <span class="text-lg text-yellow-100 font-mono font-medium">${item.law}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div id="footer-${item.id}" class="bg-black/30 p-4 border-t border-white/5 min-h-[80px] flex justify-center items-center z-10">
                            <div class="flex items-center gap-3 text-yellow-400/80 animate-pulse">
                                <div class="w-2 h-2 rounded-full bg-yellow-400"></div>
                                <span class="text-sm font-bold tracking-widest uppercase">Tahlil jarayoni...</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function updateCardsToFinishedState() {
            scenarios.forEach(item => {
                const footer = document.getElementById(`footer-${item.id}`);
                footer.innerHTML = `
                    <button onclick="revealAnswer(${item.id}, this)" class="w-full bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-green-900/30 transform transition-all active:scale-95 flex items-center justify-center gap-2 uppercase tracking-wider border border-green-400/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        JAVOBNI OCHISH
                    </button>
                `;
            });
        }

        function revealAnswer(id, btn) {
            soundManager.success(); // Ovoz
            
            const card = document.getElementById(`card-${id}`);
            const rect = btn.getBoundingClientRect();
            
            // Konfetti otish
            confetti.spawn(rect.left + rect.width/2, rect.top);

            document.getElementById(`question-${id}`).classList.add('hidden');
            const answerDiv = document.getElementById(`answer-${id}`);
            answerDiv.classList.remove('hidden');
            answerDiv.classList.add('answer-reveal');

            // Card Style Update
            card.classList.remove('from-indigo-600', 'from-blue-600', 'from-orange-600', 'from-purple-600');
            card.className = "flex flex-col relative h-full bg-slate-800 rounded-2xl border-2 border-green-500 overflow-hidden shadow-[0_0_30px_rgba(34,197,94,0.2)] transition-all duration-500";
            
            document.getElementById(`footer-${id}`).innerHTML = `
                <div class="text-green-400 font-bold flex items-center gap-2 px-4 py-2 rounded-lg bg-green-500/10 border border-green-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                    OCHILDI
                </div>
            `;
        }

        // Initialize
        init();
    </script>
</body>
</html>
