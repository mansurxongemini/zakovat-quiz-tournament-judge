<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'zbekiston Puzzle - Smartboard Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            overflow: hidden; /* Scroll bo'lmasligi uchun */
        }

        /* 3D Button Effect - Kattalashtirilgan */
        .team-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            top: 0;
            border-bottom-width: 8px; /* Qalinroq 3D effekt */
        }

        .team-btn:active {
            top: 8px;
            border-bottom-width: 0px;
            transform: translateY(2px);
        }

        /* Active State Animation */
        .team-btn.active {
            background: #16a34a; /* Green-600 */
            color: white;
            border-color: #14532d; /* Green-900 */
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
        }

        /* Check Button Animation */
        .check-btn {
            transition: transform 0.2s;
        }
        .check-btn:active {
            transform: scale(0.9);
        }

        /* Map Image Styles */
        .map-image-contain {
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }

        /* Grid Background for aesthetic (subtle) */
        .bg-grid {
            background-image: radial-gradient(#e5e7eb 2px, transparent 2px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-white bg-grid">

    <!-- HEADER QISMI (Yuqori panel) -->
    <header class="w-full h-[10vh] flex justify-between items-center px-12 border-b-4 border-gray-100 bg-white z-10">
        <div>
            <h1 class="text-4xl font-black text-blue-900 tracking-widest uppercase">PUZZLE MAP</h1>
            <p class="text-xl text-gray-400 font-bold mt-1">O'zbekiston bo'ylab sayohat</p>
        </div>
        
        <!-- Katta Savol Hisoblagich -->
        <div class="flex items-center gap-4 bg-blue-50 px-8 py-4 rounded-2xl border-2 border-blue-100">
            <span class="text-3xl text-blue-800 font-bold uppercase">Savol:</span>
            <div class="flex items-end baseline">
                <span id="question-counter" class="text-6xl font-black text-blue-600 leading-none">1</span>
                <span class="text-4xl text-gray-400 font-bold">/14</span>
            </div>
        </div>
    </header>

    <!-- ASOSIY QISM (O'rta) -->
    <main id="game-screen" class="flex-1 w-full flex flex-col items-center justify-between p-8 relative">
        
        <!-- Savol Matni (Juda katta) -->
        <h2 class="text-5xl md:text-6xl font-extrabold text-gray-800 text-center mb-4 mt-4 drop-shadow-sm">
            Bu qaysi hudud?
        </h2>

        <!-- Xarita Rasmi (Ekran markazini egallaydi) -->
        <div class="flex-1 w-full flex items-center justify-center relative my-4">
            <!-- Rasm -->
            <img 
                id="region-image" 
                src="" 
                alt="Hudud Rasmi" 
                class="h-full w-auto max-h-[50vh] map-image-contain transition-transform duration-700"
            >
            
            <!-- Javob Overlay (Nom chiqishi) -->
            <div id="region-name-overlay" class="absolute bottom-10 bg-white/90 backdrop-blur-md px-12 py-6 rounded-3xl border-4 border-blue-500 shadow-2xl hidden animate-slide-in transform translate-y-10">
                <h2 id="region-name-display" class="text-6xl font-black text-blue-900 tracking-wide text-center uppercase">Hudud Nomi</h2>
            </div>
        </div>

        <!-- PASTKI BOSHQARUV PANELI (Footer Controls) -->
        <div class="w-full h-[25vh] flex flex-col gap-6 justify-end pb-4">
            
            <!-- 1. JAMOA TANLASH (Katta Tugmalar) -->
            <div class="flex justify-center gap-8 w-full px-12">
                <button onclick="manualSelect(1)" id="btn-1" class="team-btn flex-1 h-32 bg-gray-100 border-gray-300 rounded-3xl text-6xl font-black text-gray-600 shadow-lg hover:bg-white flex items-center justify-center">1</button>
                <button onclick="manualSelect(2)" id="btn-2" class="team-btn flex-1 h-32 bg-gray-100 border-gray-300 rounded-3xl text-6xl font-black text-gray-600 shadow-lg hover:bg-white flex items-center justify-center">2</button>
                <button onclick="manualSelect(3)" id="btn-3" class="team-btn flex-1 h-32 bg-gray-100 border-gray-300 rounded-3xl text-6xl font-black text-gray-600 shadow-lg hover:bg-white flex items-center justify-center">3</button>
                <button onclick="manualSelect(4)" id="btn-4" class="team-btn flex-1 h-32 bg-gray-100 border-gray-300 rounded-3xl text-6xl font-black text-gray-600 shadow-lg hover:bg-white flex items-center justify-center">4</button>
            </div>

            <!-- 2. HARAKAT TUGMALARI (Pastki qator) -->
            <div class="flex justify-between items-center px-12 mt-2">
                
                <!-- Javobni Ko'rsatish -->
                <button onclick="showAnswer()" id="show-answer-btn" class="flex-1 max-w-md h-24 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-3xl font-bold shadow-xl transition transform active:scale-95 flex items-center justify-center gap-4">
                    <i class="fas fa-eye"></i> JAVOBNI KO'RSATISH
                </button>

                <!-- Check (Tasdiqlash) - O'rtada emas, o'ng tomonda yirik -->
                <div class="flex gap-6">
                    <button onclick="skipQuestion()" class="h-24 px-8 text-gray-400 hover:text-red-500 font-bold text-2xl transition flex items-center gap-2 rounded-2xl hover:bg-gray-50">
                        O'tkazish <i class="fas fa-forward"></i>
                    </button>

                    <button onclick="submitAnswer()" class="check-btn h-24 w-24 bg-green-500 text-white rounded-full shadow-xl flex items-center justify-center text-5xl border-4 border-green-200 ring-4 ring-green-100">
                        <i class="fas fa-check"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- NATIJALAR OYNASI (Fullscreen) -->
    <div id="result-screen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-12">
        <div class="w-full max-w-7xl flex flex-col items-center h-full justify-between py-10">
            
            <div class="text-center">
                <i class="fas fa-trophy text-yellow-400 text-9xl drop-shadow-xl mb-6 animate-bounce"></i>
                <h2 class="text-7xl font-black text-blue-900 mb-4">O'YIN YAKUNLANDI!</h2>
                <p class="text-3xl text-gray-500">Barcha 14 ta hudud muvaffaqiyatli o'rganildi.</p>
            </div>
            
            <!-- Xarita (Juda katta) -->
            <div class="flex-1 w-full flex items-center justify-center p-8">
                <img src="https://gadm.org/img/480/gadm/UZB/UZB_labs.png" class="h-full w-auto max-h-[50vh] object-contain drop-shadow-2xl" alt="O'zbekiston Xaritasi">
            </div>

            <!-- Natijalar Jadvali (Grid) -->
            <div class="grid grid-cols-4 gap-8 w-full">
                <!-- 1-Jamoa -->
                <div class="bg-blue-50 p-8 rounded-3xl border-t-8 border-blue-600 flex flex-col items-center shadow-lg">
                    <span class="text-2xl font-bold text-gray-500 uppercase tracking-widest mb-2">1-Jamoa</span>
                    <span class="text-7xl font-black text-blue-700" id="score-1">0</span>
                </div>
                <!-- 2-Jamoa -->
                <div class="bg-red-50 p-8 rounded-3xl border-t-8 border-red-600 flex flex-col items-center shadow-lg">
                    <span class="text-2xl font-bold text-gray-500 uppercase tracking-widest mb-2">2-Jamoa</span>
                    <span class="text-7xl font-black text-red-700" id="score-2">0</span>
                </div>
                <!-- 3-Jamoa -->
                <div class="bg-yellow-50 p-8 rounded-3xl border-t-8 border-yellow-500 flex flex-col items-center shadow-lg">
                    <span class="text-2xl font-bold text-gray-500 uppercase tracking-widest mb-2">3-Jamoa</span>
                    <span class="text-7xl font-black text-yellow-600" id="score-3">0</span>
                </div>
                <!-- 4-Jamoa -->
                <div class="bg-green-50 p-8 rounded-3xl border-t-8 border-green-600 flex flex-col items-center shadow-lg">
                    <span class="text-2xl font-bold text-gray-500 uppercase tracking-widest mb-2">4-Jamoa</span>
                    <span class="text-7xl font-black text-green-700" id="score-4">0</span>
                </div>
            </div>

            <button onclick="location.reload()" class="mt-12 px-16 py-6 bg-gray-900 text-white rounded-3xl hover:bg-black transition font-bold shadow-2xl flex items-center gap-4 text-3xl">
                <i class="fas fa-redo-alt"></i> Qayta Boshlash
            </button>
        </div>
    </div>

    <script>
        // MA'LUMOTLAR BAZASI
        const regions = [
            { name: "Andijon viloyati", image: "https://gadm.org/img/480/gadm/UZB/andijon/UZB_andijon.png" },
            { name: "Buxoro viloyati", image: "https://gadm.org/img/480/gadm/UZB/bukhoro/UZB_bukhoro.png" },
            { name: "Farg'ona viloyati", image: "https://gadm.org/img/480/gadm/UZB/ferghana/UZB_ferghana.png" },
            { name: "Jizzax viloyati", image: "https://gadm.org/img/480/gadm/UZB/jizzakh/UZB_jizzakh.png" },
            { name: "Xorazm viloyati", image: "https://gadm.org/img/480/gadm/UZB/khorezm/UZB_khorezm.png" },
            { name: "Namangan viloyati", image: "https://gadm.org/img/480/gadm/UZB/namangan/UZB_namangan.png" },
            { name: "Navoiy viloyati", image: "https://gadm.org/img/480/gadm/UZB/navoi/UZB_navoi.png" },
            { name: "Qashqadaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/kashkadarya/UZB_kashkadarya.png" },
            { name: "Qoraqalpog'iston Respublikasi", image: "https://gadm.org/img/480/gadm/UZB/karakalpakstan/UZB_karakalpakstan.png" },
            { name: "Samarqand viloyati", image: "https://gadm.org/img/480/gadm/UZB/samarkand/UZB_samarkand.png" },
            { name: "Sirdaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/sirdaryo/UZB_sirdaryo.png" },
            { name: "Surxondaryo viloyati", image: "https://gadm.org/img/480/gadm/UZB/surkhandarya/UZB_surkhandarya.png" },
            { name: "Toshkent viloyati", image: "https://gadm.org/img/480/gadm/UZB/tashkent/UZB_tashkent.png" },
            { name: "Toshkent shahri", image: "https://gadm.org/img/480/gadm/UZB/tashkentcity/UZB_tashkentcity.png" }
        ];

        // O'YIN STATE
        let currentQuestionIndex = 0;
        let activeTeam = 1;
        let scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
        let turnQueue = []; 

        // Elementlar
        const questionCounterEl = document.getElementById('question-counter');
        const regionNameDisplayEl = document.getElementById('region-name-display');
        const regionImageEl = document.getElementById('region-image');
        const regionNameOverlayEl = document.getElementById('region-name-overlay');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const showAnswerBtn = document.getElementById('show-answer-btn');

        initGame();

        function initGame() {
            shuffleArray(regions);
            currentQuestionIndex = 0;
            updateQuestionUI();
            setNextRandomTeam();
        }

        function setNextRandomTeam() {
            if (turnQueue.length === 0) {
                turnQueue = [1, 2, 3, 4];
                shuffleArray(turnQueue);
            }
            const nextTeam = turnQueue.pop();
            highlightTeam(nextTeam);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function highlightTeam(teamId) {
            activeTeam = teamId;
            document.querySelectorAll('.team-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${teamId}`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function manualSelect(teamId) {
            highlightTeam(teamId);
        }

        function showAnswer() {
            const currentRegion = regions[currentQuestionIndex];
            regionNameDisplayEl.innerText = currentRegion.name;
            
            // Faqat nomni ko'rsatish (overlay), rasm allaqachon ko'rinib turibdi
            regionNameOverlayEl.classList.remove('hidden');
            regionNameOverlayEl.classList.add('flex'); // hidden o'rniga flex
            regionNameOverlayEl.classList.add('animate-slide-in');
            
            showAnswerBtn.classList.add('opacity-50', 'cursor-not-allowed');
            showAnswerBtn.disabled = true;
        }

        function submitAnswer() {
            scores[activeTeam] += 100;
            nextQuestion();
        }

        function skipQuestion() {
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < regions.length) {
                resetAnswerUI();
                updateQuestionUI();
                setNextRandomTeam(); 
            } else {
                finishGame();
            }
        }

        function resetAnswerUI() {
            // Overlayni yashirish (nomni bekitish)
            regionNameOverlayEl.classList.add('hidden');
            regionNameOverlayEl.classList.remove('flex');
            regionNameOverlayEl.classList.remove('animate-slide-in');
            
            // Tugmani qayta yoqish
            showAnswerBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            showAnswerBtn.disabled = false;
        }

        function updateQuestionUI() {
            questionCounterEl.innerText = currentQuestionIndex + 1;
            
            // Yangi rasmni darhol yuklash
            const currentRegion = regions[currentQuestionIndex];
            regionImageEl.src = currentRegion.image;
        }

        function finishGame() {
            gameScreen.classList.add('hidden');
            // Header ni ham yashiramiz toza ekran uchun
            document.querySelector('header').classList.add('hidden');
            
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            document.getElementById('score-1').innerText = scores[1];
            document.getElementById('score-2').innerText = scores[2];
            document.getElementById('score-3').innerText = scores[3];
            document.getElementById('score-4').innerText = scores[4];
        }
    </script>
</body>
</html>
